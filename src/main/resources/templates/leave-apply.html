<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>请假申请</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>请假申请</h2>

    <form th:action="@{/leave/apply}" method="post">
        <div class="mb-3">
            <label class="form-label">选择课程：</label>
            <select class="form-select" name="courseId" required>
                <option value="">请选择课程</option>
                <option th:each="course : ${courses}"
                        th:value="${course.id}"
                        th:text="${course.courseName}">
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">请假开始时间：</label>
            <input type="datetime-local" class="form-control" name="startTime" required>
        </div>

        <div class="mb-3">
            <label class="form-label">请假结束时间：</label>
            <input type="datetime-local" class="form-control" name="endTime" required>
        </div>

        <div class="mb-3">
            <label class="form-label">请假原因：</label>
            <textarea class="form-control" name="reason" rows="3" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary">提交申请</button>
        <a href="/leave/list" class="btn btn-secondary">我的申请</a>
    </form>
</div>

</body>
</html>
