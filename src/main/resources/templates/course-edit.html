<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>编辑课程</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>编辑课程</h2>

    <form th:action="@{/course/update}" method="post">
        <input type="hidden" name="id" th:value="${course.id}">
        <div class="mb-3">
            <label class="form-label">课程名称：</label>
            <input type="text" class="form-control" name="courseName" th:value="${course.courseName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">课程编号：</label>
            <input type="text" class="form-control" name="courseCode" th:value="${course.courseCode}">
        </div>
        <div class="mb-3">
            <label class="form-label">班级：</label>
            <input type="text" class="form-control" name="className" th:value="${course.className}">
        </div>
        <div class="mb-3">
            <label class="form-label">上课时间：</label>
            <input type="time" class="form-control" name="startTime" th:value="${course.startTime}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">下课时间：</label>
            <input type="time" class="form-control" name="endTime" th:value="${course.endTime}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">授课教师：</label>
            <input type="text" class="form-control" name="teacherName" th:value="${course.teacherName}">
        </div>
        <div class="mb-3">
            <label class="form-label">教室：</label>
            <input type="text" class="form-control" name="classroom" th:value="${course.classroom}">
        </div>
        <div class="mb-3">
            <label class="form-label">星期：</label>
            <select class="form-control" name="weekDay">
                <option th:selected="${course.weekDay == 1}" value="1">星期一</option>
                <option th:selected="${course.weekDay == 2}" value="2">星期二</option>
                <option th:selected="${course.weekDay == 3}" value="3">星期三</option>
                <option th:selected="${course.weekDay == 4}" value="4">星期四</option>
                <option th:selected="${course.weekDay == 5}" value="5">星期五</option>
                <option th:selected="${course.weekDay == 6}" value="6">星期六</option>
                <option th:selected="${course.weekDay == 7}" value="7">星期日</option>
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label">学期：</label>
            <input type="text" class="form-control" name="semester" th:value="${course.semester}">
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="/course/list" class="btn btn-secondary">返回</a>
    </form>
</div>

</body>
</html>
