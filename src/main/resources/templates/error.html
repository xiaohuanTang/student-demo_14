<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>系统错误</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-5">
    <div class="card border-danger">
        <div class="card-header bg-danger text-white">
            <h3>系统错误</h3>
        </div>
        <div class="card-body">
            <h5 class="text-danger">错误类型：<span th:text="${exception}">Exception</span></h5>
            <p class="text-muted">请求地址：<span th:text="${url}">/</span></p>
            <p>错误信息：<span th:text="${error}">未知错误</span></p>
            <a href="/attendance/checkIn" class="btn btn-primary">返回首页</a>
            <a href="javascript:history.back()" class="btn btn-secondary">返回上一页</a>
        </div>
    </div>
</div>

</body>
</html>
