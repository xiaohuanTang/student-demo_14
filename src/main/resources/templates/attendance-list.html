<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>考勤记录</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>考勤记录</h2>

    <!-- 筛选条件 -->
    <form th:action="@{/attendance/list}" method="get" class="mb-4">
        <div class="row">
            <div class="col-md-2">
                <input type="date" class="form-control" name="startDate" th:value="${startDate}" placeholder="开始日期">
            </div>
            <div class="col-md-2">
                <input type="date" class="form-control" name="endDate" th:value="${endDate}" placeholder="结束日期">
            </div>
            <div class="col-md-2">
                <select class="form-select" name="status">
                    <option value="">全部状态</option>
                    <option value="NORMAL" th:selected="${status == 'NORMAL'}">正常</option>
                    <option value="LATE" th:selected="${status == 'LATE'}">迟到</option>
                    <option value="EARLY" th:selected="${status == 'EARLY'}">早退</option>
                    <option value="ABSENT" th:selected="${status == 'ABSENT'}">缺勤</option>
                </select>
            </div>
            <div class="col-md-2">
                <select class="form-select" name="courseId">
                    <option value="">全部课程</option>
                    <option th:each="course : ${courses}"
                            th:value="${course.id}"
                            th:text="${course.courseName}"
                            th:selected="${courseId == course.id}">
                    </option>
                </select>
            </div>
            <div class="col-md-4">
                <button type="submit" class="btn btn-primary">筛选</button>
                <a href="/attendance/list" class="btn btn-secondary">重置</a>
                <button type="button" id="exportBtn" class="btn btn-success">导出Excel</button>
            </div>
        </div>
    </form>

    <!-- 数据表格 -->
    <table class="table table-striped">
        <thead>
        <tr>
            <th>日期</th>
            <th>课程</th>
            <th>打卡时间</th>
            <th>座位</th>
            <th>状态</th>
            <th>IP</th>
            <th>备注</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="record : ${records}">
            <td th:text="${#temporals.format(record.checkInTime, 'yyyy-MM-dd')}"></td>
            <td th:text="${record.courseName}"></td>
            <td th:text="${#temporals.format(record.checkInTime, 'HH:mm:ss')}"></td>
            <td th:text="${record.seatRow != null ? record.seatRow + '行' + record.seatCol + '列' : '-'}"></td>
            <td>
                <span th:if="${record.status == 'NORMAL'}" class="badge bg-success">正常</span>
                <span th:if="${record.status == 'LATE'}" class="badge bg-warning">迟到</span>
                <span th:if="${record.status == 'EARLY'}" class="badge bg-info">早退</span>
                <span th:if="${record.status == 'ABSENT'}" class="badge bg-danger">缺勤</span>
            </td>
            <td th:text="${record.ip != null ? record.ip : '-'}"></td>
            <td th:text="${record.remark != null ? record.remark : '-'}"></td>
        </tr>
        <tr th:if="${records.empty}">
            <td colspan="7" class="text-center">暂无数据</td>
        </tr>
        </tbody>
    </table>
</div>

<script>
    // 导出功能：获取当前筛选条件，跳转到导出接口
    document.getElementById('exportBtn').addEventListener('click', function() {
        var form = document.querySelector('form');
        var params = new URLSearchParams(new FormData(form));
        window.location.href = '/attendance/export?' + params.toString();
    });
</script>

</body>
</html>
