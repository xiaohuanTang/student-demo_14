<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的请假</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>我的请假记录</h2>
    <a href="/leave/apply" class="btn btn-primary mb-3">+ 新增请假</a>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>课程</th>
            <th>开始时间</th>
            <th>结束时间</th>
            <th>原因</th>
            <th>状态</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="leave : ${leaves}">
            <td th:text="${leave.courseName}"></td>
            <td th:text="${#temporals.format(leave.startTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${#temporals.format(leave.endTime, 'yyyy-MM-dd HH:mm')}"></td>
            <td th:text="${leave.reason}"></td>
            <td>
                <span th:if="${leave.status == 'PENDING'}" class="badge bg-warning">待审批</span>
                <span th:if="${leave.status == 'APPROVED'}" class="badge bg-success">已批准</span>
                <span th:if="${leave.status == 'REJECTED'}" class="badge bg-danger">已拒绝</span>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
