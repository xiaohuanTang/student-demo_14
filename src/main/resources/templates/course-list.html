<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>课程管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>课程管理</h2>
    <a href="/course/add" class="btn btn-primary mb-3">+ 新增课程</a>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>课程名称</th>
            <th>课程编号</th>
            <th>班级</th>
            <th>上课时间</th>
            <th>下课时间</th>
            <th>教师</th>
            <th>教室</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="course : ${courses}">
            <td th:text="${course.id}"></td>
            <td th:text="${course.courseName}"></td>
            <td th:text="${course.courseCode}"></td>
            <td th:text="${course.className}"></td>
            <td th:text="${course.startTime}"></td>
            <td th:text="${course.endTime}"></td>
            <td th:text="${course.teacherName}"></td>
            <td th:text="${course.classroom}"></td>
            <td>
                <a th:href="@{/course/edit/{id}(id=${course.id})}" class="btn btn-sm btn-warning">编辑</a>
                <a th:href="@{/course/delete/{id}(id=${course.id})}" class="btn btn-sm btn-danger" onclick="return confirm('确定删除？')">删除</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
