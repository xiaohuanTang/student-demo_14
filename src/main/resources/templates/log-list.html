<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>操作日志</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="fragments/navbar :: navbar"></div>

<div class="container mt-4">
    <h2>操作日志</h2>

    <table class="table table-striped table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>操作人</th>
            <th>操作类型</th>
            <th>请求方法</th>
            <th>IP</th>
            <th>耗时(ms)</th>
            <th>状态</th>
            <th>操作时间</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${logs}">
            <td th:text="${log.id}"></td>
            <td th:text="${log.userName} + '(' + ${log.userId} + ')'"></td>
            <td th:text="${log.operation}"></td>
            <td th:text="${log.method}" style="max-width: 300px; word-break: break-all;"></td>
            <td th:text="${log.ip}"></td>
            <td th:text="${log.duration}"></td>
            <td>
                <span th:if="${log.status == 'SUCCESS'}" class="badge bg-success">成功</span>
                <span th:if="${log.status == 'FAIL'}" class="badge bg-danger">失败</span>
            </td>
            <td th:text="${#temporals.format(log.createTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
        </tr>
        <tr th:if="${logs.empty}">
            <td colspan="8" class="text-center">暂无数据</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
